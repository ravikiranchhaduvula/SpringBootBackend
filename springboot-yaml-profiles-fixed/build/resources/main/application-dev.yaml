server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: postgres
  logging:
    file:
      name: logs/app.log
  #security:
    #user:
      #name: ravi
      #password: "{noop}secret"
      #password: "{bcrypt}$2a$10$gbQ6jVQCCrfLXW5C6Kk33e.kGWrtBP998GB7laPnTfI0PFQD7Xc/y"
      #roles: ADMIN,USER
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

        # ✅ enable Hibernate L2 + query cache
        cache.use_second_level_cache: false
        cache.use_query_cache: false

        # ✅ tell Hibernate to use JCache (Ehcache) region factory
        cache.region.factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

        # optional: create missing regions automatically
        javax.cache.missing_cache_strategy: create

  # ✅ Spring’s JCache config location (hands it to Ehcache)
  cache:
    jcache:
      config: classpath:ehcache.xml

kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: payment-group
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer

myapp:
  name: DevApp
  features: [login, signup]
  logger-type: consoleLogger

logging:
  level:
    org.springframework.security: DEBUG

# application.yml
app:
  jwt:
    secret: "change-this-to-256-bit-random-string-aaaaaaaa-bbbbbbbb-cccccccc-dddddddd" # ~32+ chars
    expiry: 3600  # seconds

external:
  user-service:
    base-url: http://localhost:8081

resilience4j:
  circuitbreaker:
    instances:
      extUserSync:                                # name used in @CircuitBreaker/@Retry
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10                 # look at last 10 calls
        failureRateThreshold: 50              # open if >50% failed
        slowCallDurationThreshold: 2s         # calls slower than 2s are "slow"
        slowCallRateThreshold: 50             # open if >50% are slow
        waitDurationInOpenState: 10s          # stay open for 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      extUserAsync:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  ratelimiter:
    instances:
      extUserRl:
        limitForPeriod: 5          # allow 5 calls...
        limitRefreshPeriod: 1s     # ...per 1 second window
        timeoutDuration: 200ms     # how long to wait for a permit (0 = fail fast)
  retry:
    instances:
      extUserSync:
        maxAttempts: 3                        # 1 original + 2 retries
        waitDuration: 200ms                   # fixed backoff per retry
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException   # timeouts, I/O
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.net.SocketTimeoutException
      extUserAsync:
        maxAttempts: 3
        waitDuration: 200ms

  bulkhead:
    instances:
      # synchronous semaphore bulkhead (fast, no extra threads)
      extUserSync:
        maxConcurrentCalls: 5
        maxWaitDuration: 0    # don't queue; fail fast if full

  thread-pool-bulkhead:
    instances:
      # for async + timelimiter (uses its own thread pool)
      extUserAsync:
        maxThreadPoolSize: 10
        coreThreadPoolSize: 5
        queueCapacity: 20

  timelimiter:
    instances:
      # used with async/CompletableFuture methods
      extUserAsync:
        timeoutDuration: 1s
        cancelRunningFuture: true

  management:
    tracing:
      sampling:
        probability: 1.0          # 20% of requests sampled (adjust to taste)
      propagation:
        type: b3                    # b3 or b3_single; choose one
      baggage:
        # Which custom fields are allowed to propagate over the wire
        remote-fields: tenantId, requestId
        # Which baggage fields go into logs (MDC) locally
        correlation:
          enabled: true
          fields: tenantId, requestId

    # optional: if you want to export to Zipkin
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans

  logging:
    pattern:
      # Include trace/span/baggage in logs
      level: "%5p"
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg %n"
    # For Logback MDC, define your pattern in logback-spring.xml (next section)
